name: Frontend CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  checks:
    name: Lint, typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Upload production build
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy to EC2
    needs: checks
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EC2_HOST: ${{ vars.EC2_HOST }}
      EC2_USER: ${{ vars.EC2_USER }}
    steps:
      - name: Check out deployment scripts
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Download checked production build
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: dist/
      - name: Configure SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          test -n "$EC2_HOST" && test -n "$EC2_USER"
          test -n "$EC2_SSH_KEY" && test -n "$EC2_KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$EC2_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Publish frontend and verify Nginx response
        run: |
          archive="rtr-frontend-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tar.gz"
          tar -czf "$RUNNER_TEMP/$archive" -C dist .
          scp -o BatchMode=yes -o ConnectTimeout=15 "$RUNNER_TEMP/$archive" "$EC2_USER@$EC2_HOST:/home/ubuntu/.cache/$archive"
          ssh -o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=15 "$EC2_USER@$EC2_HOST" \
            bash -s -- "/home/ubuntu/.cache/$archive" "$GITHUB_SHA" < deployment/deploy.sh
